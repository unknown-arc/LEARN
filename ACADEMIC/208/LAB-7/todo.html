<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>To-Do Board — Desk Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/todo.css">
</head>
<body class="todo">
<div class="backdrop" style="background-image:url(assets/todo/board.jpg)"></div>
<main class="stage" id="stage">
  <img class="bg" src="assets/todo/board.jpg" alt="" width="1234" height="864">

  <svg class="layer shaft" viewBox="0 0 1234 864" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff1c2" stop-opacity=".45"/><stop offset=".7" stop-color="#ffe4a0" stop-opacity=".16"/><stop offset="1" stop-color="#ffd98a" stop-opacity="0"/></linearGradient>
      <filter id="sb" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="22"/></filter>
    </defs>
    <polygon points="140,0 520,0 1060,864 700,864" fill="url(#sg)" filter="url(#sb)"/>
  </svg>

  <!-- Assignment 2: the sticky notes ARE the task list -->
  <ul class="cork" id="taskList" aria-label="Tasks"></ul>

  <form class="addbar" id="addForm" autocomplete="off">
    <label class="sr" for="taskInput">New task</label>
    <input id="taskInput" type="text" maxlength="80" placeholder="Write a new sticky note…">
    <button class="btn" type="submit" id="addBtn">Add Task</button>
    <div class="counts" aria-live="polite">
      <span class="chip">Total <b id="total">0</b></span>
      <span class="chip ok">Completed <b id="doneCount">0</b></span>
    </div>
    <div class="prog" title="Board progress"><i id="prog"></i></div>
    <button class="btn ghost small" type="button" id="clearDone">Clear done</button>
    <small class="err" id="taskErr" role="alert"></small>
  </form>

  <canvas class="dust" id="dust"></canvas>
</main>

<script src="js/game.js"></script>
<script src="js/particles.js"></script>
<script src="js/todo.js"></script>
</body>
</html>
