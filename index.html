<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Choose between academic work and independent learning." />
  <title>Learning Space</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <main class="landing" aria-label="Choose a learning category">
    <p class="eyebrow">MY LEARNING SPACE <span aria-hidden="true">✳</span></p>
    <h1>Pick your<br /><span>path.</span></h1>

    <div class="card-grid">
      <a class="choice-card academic" href="#" data-section="academic" aria-label="Open Academic">
        <span class="card-number">01 / STUDIES</span>
        <span class="card-icon" aria-hidden="true">↗</span>
        <span class="card-title">ACADEMIC</span>
        <span class="card-description">Coursework, assignments<br />and class projects.</span>
        <span class="card-bottom">EXPLORE <span aria-hidden="true">→</span></span>
      </a>

      <a class="choice-card independent" href="#" data-section="independent" aria-label="Open Independent">
        <span class="card-number">02 / ON MY OWN</span>
        <span class="card-icon" aria-hidden="true">✳</span>
        <span class="card-title">INDEPENDENT</span>
        <span class="card-description">Self-learning, experiments<br />and side projects.</span>
        <span class="card-bottom">EXPLORE <span aria-hidden="true">→</span></span>
      </a>
    </div>
    <p class="micro-copy">TWO WAYS TO KEEP MOVING.</p>
  </main>
</body>
</html>
